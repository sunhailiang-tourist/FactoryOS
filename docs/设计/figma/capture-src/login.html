<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ax OS - 登录</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 20% 30%, rgba(30, 64, 175, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(15, 118, 110, 0.1) 0%, transparent 50%);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased text-slate-200">
<div class="w-full max-w-md px-6">
<!-- Logo Area -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-600 mb-4 shadow-lg shadow-blue-500/20">
<iconify-icon class="text-4xl text-white" icon="ph:factory-bold"></iconify-icon>
</div>
<h1 class="text-4xl font-bold tracking-tight text-white mb-1">Ax OS</h1>
<p class="text-blue-400 font-medium tracking-widest text-sm uppercase">智能中枢系统</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-3xl p-8 shadow-2xl">
<h2 class="text-xl font-semibold mb-6 text-center">用户登录</h2>
<form class="space-y-5" id="loginForm">
<div>
<label class="block text-sm font-medium text-slate-400 mb-1.5">账号/手机号</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
<iconify-icon icon="ph:user-bold"></iconify-icon>
</span>
<input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-600" placeholder="请输入您的账号" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-400 mb-1.5">登录密码</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
<iconify-icon icon="ph:lock-key-bold"></iconify-icon>
</span>
<input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-600" placeholder="请输入密码" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-400 mb-1.5">租户 ID</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
<iconify-icon icon="ph:buildings-bold"></iconify-icon>
</span>
<input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-600" placeholder="如 T-001 哈森制造" type="text" value="T-001"/>
</div>
</div>
<div class="flex items-center justify-between text-sm">
<label class="flex items-center space-x-2 cursor-pointer">
<input class="rounded border-slate-700 bg-slate-800 text-blue-600 focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="text-slate-400">记住登录状态</span>
</label>
<a class="text-blue-400 hover:text-blue-300 transition-colors" href="#">忘记密码？</a>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center space-x-2 active:scale-[0.98]" onclick="window.location.href='kpi_dashboard.html'" type="button">
<span>安全登录</span>
<iconify-icon icon="ph:arrow-right-bold"></iconify-icon>
</button>
</form>
<div class="mt-8 pt-6 border-t border-slate-700/50 flex flex-col items-center space-y-4">
<p class="text-xs text-slate-500">其他登录方式</p>
<div class="flex space-x-6">
<button class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition-colors border border-slate-700">
<iconify-icon class="text-xl text-blue-400" icon="ri:dingding-fill"></iconify-icon>
</button>
<button class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition-colors border border-slate-700">
<iconify-icon class="text-xl text-emerald-400" icon="ri:wechat-pay-fill"></iconify-icon>
</button>
</div>
</div>
</div>
<div class="mt-12 text-center text-slate-500 text-xs">
<p>Ax OS v1.0.0 企业版 | 基于 FactoryOS 内核</p>
<p class="mt-2">© 2026 Ax OS 智能中枢系统. 保留所有权利.</p>
</div>
</div>
</body>
</html>
