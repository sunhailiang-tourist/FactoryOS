# FactoryOS 业务错误码注册表 · 唯一真源（SSOT）
# 镜像：errors.py（mirror_python）· web-admin/error-codes.ts（mirror_typescript）
# 门禁：./scripts/check_error_registry_sync.py · 对齐：./scripts/sync_error_registry.py --apply（须人工确认后）
# 规约：docs/文档/规格说明/状态码与错误约定.md

version: 1
updated: "2026-07-06"
decision_ref: error-registry-v1

governance:
  ssot: contracts/error-registry.yaml
  sync_policy: human_confirm_before_apply
  mirrors:
    python_enum:
      path: src/server/os_core/shared_contracts/errors.py
      field: mirror_python
      includes: [ErrorCode, ERROR_MESSAGE_ZH, default_message]
    typescript:
      path: src/apps/web-admin/src/api/request/error-codes.ts
      field: mirror_typescript
      includes: [ERROR_CODES, ERROR_MESSAGES_ZH, getErrorMessageZh]
  on_drift: |
    gate 失败并输出 ADD / DELETE / CHANGE；
    禁止 Agent 擅自 --apply；须负责人确认后再执行一致性策略。

codes:
  # ── 内核 / 执行（platform · source B）──
