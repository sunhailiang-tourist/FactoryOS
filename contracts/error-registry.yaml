    status: active
    mirror_python: true
    mirror_typescript: true
    http_default: 409
    source: B
    domain: platform
    message_zh: Graph 未冻结或状态不允许该操作
    retry: manual
    ac: [BASE-001]

  - code: RULE_DENIED
